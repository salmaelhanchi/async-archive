<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
<title id="title">Files per second under the same politeness cap</title>
<desc id="desc">Sequential baseline against the asyncio mirror at 1, 4, 8 and 16 workers, 40 files, cap 2 requests per second. Values are in the table in the README.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; }
  .ink-2 { fill: #52514e; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #a3a29b; stroke-width: 1; }
  .cap { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .v1 { fill: #eb6834; }
  .v2 { fill: #2a78d6; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; }
    .axis { stroke: #6b6a64; }
    .cap { stroke: #c3c2b7; }
    .v1 { fill: #d95926; }
    .v2 { fill: #3987e5; }
  }
</style>
<rect class="surface" width="760" height="330" rx="8"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="600">Files per second, same politeness cap (2 requests/s per host)</text>
<text class="ink-2" x="24" y="56" font-size="12.5">40 files, 38 MB, 20 ms latency, 1 MB/s per connection; median of 3 runs</text>
<rect class="v1" x="24" y="68" width="10" height="10" rx="2"/>
<text class="ink-2" x="40" y="77" font-size="12">baseline: sequential, requests</text>
<rect class="v2" x="236" y="68" width="10" height="10" rx="2"/>
<text class="ink-2" x="252" y="77" font-size="12">this project: asyncio</text>
<line class="grid" x1="210.0" y1="86" x2="210.0" y2="272"/>
<text class="ink-2" x="210.0" y="290" font-size="11.5" text-anchor="middle">0</text>
<line class="grid" x1="294.0" y1="86" x2="294.0" y2="272"/>
<text class="ink-2" x="294.0" y="290" font-size="11.5" text-anchor="middle">0.4</text>
<line class="grid" x1="378.0" y1="86" x2="378.0" y2="272"/>
<text class="ink-2" x="378.0" y="290" font-size="11.5" text-anchor="middle">0.8</text>
<line class="grid" x1="462.0" y1="86" x2="462.0" y2="272"/>
<text class="ink-2" x="462.0" y="290" font-size="11.5" text-anchor="middle">1.2</text>
<line class="grid" x1="546.0" y1="86" x2="546.0" y2="272"/>
<text class="ink-2" x="546.0" y="290" font-size="11.5" text-anchor="middle">1.6</text>
<line class="grid" x1="630.0" y1="86" x2="630.0" y2="272"/>
<text class="ink-2" x="630.0" y="290" font-size="11.5" text-anchor="middle">2</text>
<line class="axis" x1="210" y1="86" x2="210" y2="272"/>
<text class="ink" x="198" y="114.0" font-size="13" text-anchor="end">v1 sequential (requests)</text>
<path class="v1" d="M210.0,101.0 h119.2 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-119.2 z"/>
<text class="ink" x="644.0" y="114.0" font-size="12.5">0.59</text>
<text class="ink" x="198" y="150.0" font-size="13" text-anchor="end">v2, 1 worker</text>
<path class="v2" d="M210.0,137.0 h154.6 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-154.6 z"/>
<text class="ink" x="644.0" y="150.0" font-size="12.5">0.76  (1.3x)</text>
<text class="ink" x="198" y="186.0" font-size="13" text-anchor="end">v2, 4 workers</text>
<path class="v2" d="M210.0,173.0 h329.3 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-329.3 z"/>
<text class="ink" x="644.0" y="186.0" font-size="12.5">1.59  (2.7x)</text>
<text class="ink" x="198" y="222.0" font-size="13" text-anchor="end">v2, 8 workers</text>
<path class="v2" d="M210.0,209.0 h329.9 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-329.9 z"/>
<text class="ink" x="644.0" y="222.0" font-size="12.5">1.59  (2.7x)</text>
<text class="ink" x="198" y="258.0" font-size="13" text-anchor="end">v2, 16 workers</text>
<path class="v2" d="M210.0,245.0 h330.0 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-330.0 z"/>
<text class="ink" x="644.0" y="258.0" font-size="12.5">1.59  (2.7x)</text>
<line class="cap" x1="583.3" y1="82" x2="583.3" y2="272"/>
<text class="ink-2" x="583.3" y="78" font-size="11.5" text-anchor="middle">most the cap allows: 1.78</text>
<text class="ink-2" x="420.0" y="312" font-size="12" text-anchor="middle">files per second (higher is better)</text>
</svg>
