# Demo: the mirror downloads the local archive server's tree over the compose network,
# verifies every file against its published .sha256, unpacks the .tar.gz archives in worker
# processes, and keeps state and files in a volume.
# Run it twice: the second run lists again and downloads and unpacks nothing.
# `docker compose stop mirror` mid-run sends SIGTERM: the run stops cleanly and resumes.
#   docker compose -f deploy/docker-compose.yml up --build --abort-on-container-exit
services:
  archive:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: bench
    command:
      - /app/.venv/bin/python
      - -m
      - bench.archive_server
      - --host=0.0.0.0
      - --port=8080
      - --depth=2
      - --files=10
      - --max-size=2000000
      - --checksums
      - --real-archives
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/robots.txt')"]
      interval: 2s
      retries: 15

  mirror:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    depends_on:
      archive:
        condition: service_healthy
    command: ["mirror", "http://archive:8080/"]
    environment:
      ARCHIVE_MIRROR_MIRROR_ROOT: /data/mirror
      ARCHIVE_MIRROR_EXTRACT_ROOT: /data/extracted
      ARCHIVE_MIRROR_DOWNLOAD_WORKERS: "8"
      ARCHIVE_MIRROR_LISTING_WORKERS: "8"
      ARCHIVE_MIRROR_MAX_IN_FLIGHT: "8"
      ARCHIVE_MIRROR_PER_HOST_RATE: "100"
      ARCHIVE_MIRROR_PER_HOST_BURST: "8"
      ARCHIVE_MIRROR_METRICS_PORT: "9100"
    ports:
      - "9100:9100"
    volumes:
      - mirror-state:/data

volumes:
  mirror-state:
