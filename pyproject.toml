[project]
name = "async-archive-mirror"
version = "0.1.0"
description = "Mirror public archives published as nested directory listings, with asyncio backpressure, per-host rate limits and resumable state."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "httpx[http2]>=0.27",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    # httpcore imports sniffio on every request to detect the event loop. Without it each
    # request pays a failed import that scans sys.path (measured: ~1.1 s per 400 requests).
    "sniffio>=1.3",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
archive-mirror = "archive_mirror.cli:app"

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_mirror"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "S", "C4", "PIE", "RET"]
ignore = [
    "S311", # random is used for retry jitter, not for security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]
"bench/**" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that run a real HTTP server or database file",
    "slow: the kill-and-resume trials (skip locally with -m 'not slow')",
]
addopts = "-ra --strict-markers"
